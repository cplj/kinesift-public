name: Publish container image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require an existing published release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (data.draft || !data.published_at) core.setFailed('Publish the matching release before publishing an image.');
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Verify image version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, runpy; assert os.environ["RELEASE_TAG"] == "v" + runpy.run_path("__init__.py")["__version__"]'
      - run: python -m pip install --no-index --no-cache-dir .
      - run: python -m unittest discover -s tests -v
      - uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kinesift:${{ github.ref_name }}
